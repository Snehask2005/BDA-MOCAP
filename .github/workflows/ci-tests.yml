name: MOCAP CI Tests

on:
  push:
    branches: [ main, develop, 'feat/**', 'exp/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Pytest Suite
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Run Phase 1 & 2 Benchmark Smoke Tests
      run: |
        python experiments/run_phase1_benchmark.py
        python experiments/run_phase2_conformal.py
        python reproduction/fig3_rank_correlation.py
        python reproduction/fig4_conformal_coverage.py

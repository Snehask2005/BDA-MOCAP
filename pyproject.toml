[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap"
version = "0.1.0"
description = "Multi-Objective Cost-Aware Planner for Budget-Constrained Query Optimization"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["mocap*"]
